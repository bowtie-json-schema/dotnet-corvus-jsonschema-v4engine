version: 2
updates:
  # common configuration
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 3

  # add test harness configuration here
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      corvus-json:
        patterns:
          - "Corvus.Json.*"
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
    cooldown:
      default-days: 3
